# Production-only deployment. CI builds and publishes the image to GHCR;
# Coolify pulls this exact revision and never builds application source.
services:
  portfolio:
    image: ghcr.io/jaypeefern/portfolio-v2:${SOURCE_COMMIT:?SOURCE_COMMIT must be the exact full lowercase Git commit SHA}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Keep the runtime guard name distinct from Coolify's SOURCE_COMMIT.
      DEPLOYMENT_REVISION: ${SOURCE_COMMIT:?SOURCE_COMMIT must be the exact full lowercase Git commit SHA}
      SITE_URL: ${SITE_URL:?Set the canonical HTTPS origin in Coolify}
      SEO_DEPLOYMENT_ENV: ${SEO_DEPLOYMENT_ENV:?Set SEO_DEPLOYMENT_ENV to production}
      SEO_TRUSTED_PROXY_ORIGIN: ${SEO_TRUSTED_PROXY_ORIGIN:?Set the trusted ingress origin policy}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the Resend API key in Coolify secrets}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
