<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: cutaway-variant-four.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=REM:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f7ee}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <figure class="r-section-art region plate" data-region="section-art"><img src="../../../assets/plates/section-art.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-portrait region plate" data-region="portrait"><img src="../../../assets/plates/portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-brand-mark region chrome" data-region="brand-mark"><!-- Small two-part cobalt and coral portfolio mark at the upper-left. --></div>
  <div class="r-navigation region chrome" data-region="navigation"><!-- Right-aligned About, Work, Experience, Contact navigation. --></div>
  <div class="r-capability-flow region text" data-region="capability-flow"><!-- Code-owned semantic wrapper for the three source-driven technology groups on the cutaway. Labels wrap as each group grows. When content outgrows a plane's fixed artwork, continue that group's list below the cutaway in normal document flow; the page scrolls naturally. Never clip skills or add nested scrolling. --><p style="line-height:1.05;margin:0">capability-flow</p></div>
  <div class="r-name region text" data-region="name"><!-- Two-line high-impact display name John Paul Fernandez in the left profile field. --><p style="font-size:var(--r-name-font);font-family:var(--r-name-family),sans-serif;font-weight:var(--r-name-weight);line-height:1.05;margin:0">name</p></div>
  <div class="r-role region text" data-region="role"><!-- Full Stack Developer role immediately below the name. --><p style="font-size:var(--r-role-font);line-height:1.05;margin:0">role</p></div>
  <div class="r-positioning region text" data-region="positioning"><!-- Short profile headline Fast, clear, dependable web products. --><p style="font-size:var(--r-positioning-font);line-height:1.05;margin:0">positioning</p></div>
  <div class="r-profile-copy region text" data-region="profile-copy"><!-- Compact profile paragraph below the headline. --><p style="font-size:var(--r-profile-copy-font);line-height:1.05;margin:0">profile-copy</p></div>
  <div class="r-experience-proof region text" data-region="experience-proof"><!-- 3+ years building web products, the only current experience claim. --><p style="font-size:var(--r-experience-proof-font);line-height:1.05;margin:0">experience-proof</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- Single prominent See my work call to action.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop primary-action); a control need not have button chrome --></div>
  <div class="r-interfaces-heading region text" data-region="interfaces-heading"><!-- Interfaces capability group title. --><p style="font-size:var(--r-interfaces-heading-font);line-height:1.05;margin:0">interfaces-heading</p></div>
  <div class="r-interfaces-skills region text" data-region="interfaces-skills"><!-- React and Tailwind CSS skill labels with their brand icons. Technology labels wrap as the list grows; this group expands in normal page flow, with no nested scrolling or clipped skills. --><p style="font-size:var(--r-interfaces-skills-font);line-height:1.05;margin:0">interfaces-skills</p></div>
  <div class="r-applications-heading region text" data-region="applications-heading"><!-- Applications capability group title. --><p style="font-size:var(--r-applications-heading-font);line-height:1.05;margin:0">applications-heading</p></div>
  <div class="r-applications-skills region text" data-region="applications-skills"><!-- Next.js and TypeScript skill labels with their brand icons. Technology labels wrap as the list grows; this group expands in normal page flow, with no nested scrolling or clipped skills. --><p style="font-size:var(--r-applications-skills-font);line-height:1.05;margin:0">applications-skills</p></div>
  <div class="r-backend-heading region text" data-region="backend-heading"><!-- Backend systems capability group title, broken over two lines. --><p style="font-size:var(--r-backend-heading-font);line-height:1.05;margin:0">backend-heading</p></div>
  <div class="r-backend-skills region text" data-region="backend-skills"><!-- Node.js, NestJS, PostgreSQL, MongoDB, Docker, Git, Firebase, and Nginx labels with their brand icons. Technology labels wrap as the list grows; this group expands in normal page flow, with no nested scrolling or clipped skills. --><p style="font-size:var(--r-backend-skills-font);line-height:1.05;margin:0">backend-skills</p></div>
  <div class="r-projects-heading region text" data-region="projects-heading"><!-- Selected projects section heading at the start of the lower chalk plane. --><p style="font-size:var(--r-projects-heading-font);line-height:1.05;margin:0">projects-heading</p></div>
  <div class="r-projects-empty-state region text" data-region="projects-empty-state"><!-- Honest status that project writeups are not published yet. --><p style="font-size:var(--r-projects-empty-state-font);line-height:1.05;margin:0">projects-empty-state</p></div>
</main>
</body>
</html>
